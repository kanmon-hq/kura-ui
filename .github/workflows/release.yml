name: Release & Publish Package

permissions:
  contents: write
  packages: write
  id-token: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). Optional if tag was pushed.'
        required: false
        type: string

jobs:
  publish:
    name: Build & Publish Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Upgrade npm to latest (Required for Trusted Publishing OIDC)
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci

      - name: Set Package Version from Git Tag
        run: |
          TARGET_VERSION=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TARGET_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TARGET_VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TARGET_VERSION="${GITHUB_REF_NAME}"
          fi

          if [ -z "$TARGET_VERSION" ]; then
            echo "Error: No release version could be determined from tag or inputs."
            exit 1
          fi

          TARGET_VERSION="${TARGET_VERSION#v}"
          echo "Setting package version to: $TARGET_VERSION"
          npm version "$TARGET_VERSION" --no-git-tag-version --allow-same-version

      - name: Type Check & Build
        run: npm run build

      - name: Publish to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" > ~/.npmrc
          npm publish --registry https://npm.pkg.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npmjs.com
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Publishing to npmjs.com using NPM_TOKEN (initial release)..."
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
            npm publish --registry https://registry.npmjs.org --access public --provenance
          else
            echo "Publishing to npmjs.com using OIDC Trusted Publishing..."
            rm -f ~/.npmrc
            npm publish --registry https://registry.npmjs.org --access public --provenance
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            RELEASE_TAG="v${{ github.event.inputs.version }}"
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
          else
            echo "Release $RELEASE_TAG already exists, skipping release creation."
          fi
