name: Release & Publish Package

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). Optional if tag was pushed.'
        required: false
        type: string

jobs:
  publish:
    name: Build & Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kanmon-hq'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Version from Tag or Input
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            npm version "${{ github.event.inputs.version }}" --no-git-tag-version --allow-same-version
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Type Check & Build
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            RELEASE_TAG="v${{ github.event.inputs.version }}"
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
          else
            echo "Release $RELEASE_TAG already exists, skipping release creation."
          fi
